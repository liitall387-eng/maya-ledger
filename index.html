<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EDE7F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maya的小账本">
<link rel="apple-touch-icon" href="icon.png">
<title>Maya的小账本</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --purple: #9B8EC4; --purple-light: #BEA9D9; --purple-bg: #efe8f5;
    --bg: #faf8f5; --card: #ffffff; --text: #4a3f5c;
    --text-light: #a89bc2; --text-muted: #c4bdd4;
    --danger: #e07575; --success: #7BB5A3;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    max-width: 420px; margin: 0 auto; padding-bottom: 100px; overflow-x: hidden;
  }
  .header {
    text-align: center; padding: 36px 20px 20px;
    background: linear-gradient(180deg, var(--purple-bg) 0%, var(--bg) 100%);
  }
  .header-cat { font-size: 42px; display: inline-block; animation: catBounce 2s ease-in-out infinite; cursor: pointer; }
  .header-cat:active { transform: scale(1.3) rotate(10deg); }
  @keyframes catBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .header h1 { font-size: 22px; font-weight: 800; margin: 8px 0 4px; letter-spacing: 1px; }
  .header .subtitle { font-size: 13px; color: var(--text-light); font-style: italic; }
  .cat-mood { font-size: 11px; color: var(--text-muted); margin-top: 6px; min-height: 16px; }

  .month-bar { display:flex; align-items:center; justify-content:center; gap:16px; padding:14px 20px 4px; }
  .month-btn { background:none; border:none; font-size:20px; color:var(--purple); cursor:pointer; padding:4px 10px; border-radius:8px; }
  .month-btn:active { background:var(--purple-bg); }
  .month-label { font-size:16px; font-weight:700; min-width:120px; text-align:center; }

  .total-card {
    margin:14px 20px; padding:28px 24px;
    background:linear-gradient(135deg,var(--purple) 0%,var(--purple-light) 100%);
    border-radius:22px; text-align:center; box-shadow:0 8px 28px rgba(155,142,196,0.28);
    position:relative; overflow:hidden;
  }
  .total-label { font-size:13px; color:rgba(255,255,255,0.8); }
  .total-amount { font-size:40px; font-weight:900; color:#fff; margin:6px 0; letter-spacing:-1px; }
  .total-count { font-size:12px; color:rgba(255,255,255,0.6); }
  .daily-avg { margin-top:10px; font-size:12px; color:rgba(255,255,255,0.7); border-top:1px solid rgba(255,255,255,0.15); padding-top:10px; }

  /* Month Compare */
  .month-compare {
    margin:0 20px 6px; padding:10px 16px;
    background:var(--card); border-radius:12px; box-shadow:0 2px 6px rgba(0,0,0,0.03);
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:12px; color:#888;
  }
  .compare-up { color:var(--danger); font-weight:700; }
  .compare-down { color:var(--success); font-weight:700; }
  .compare-same { color:var(--text-muted); font-weight:700; }

  .cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 20px 6px; }
  .cat-card { background:var(--card); border-radius:14px; padding:14px; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
  .cat-card:active { transform:scale(0.97); }
  .cat-head { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .cat-emoji { font-size:16px; }
  .cat-name { font-size:13px; color:#888; font-weight:500; }
  .cat-amt { font-size:18px; font-weight:700; color:#333; }
  .cat-bar-bg { height:4px; background:#f0ede8; border-radius:2px; margin-top:8px; overflow:hidden; }
  .cat-bar { height:100%; border-radius:2px; transition:width 0.6s cubic-bezier(0.4,0,0.2,1); }

  .section-header { padding:18px 20px 10px; display:flex; justify-content:space-between; align-items:center; }
  .section-title { font-size:16px; font-weight:700; }

  /* Search */
  .search-bar {
    margin:0 20px 10px; position:relative;
  }
  .search-input {
    width:100%; padding:12px 16px 12px 38px; border-radius:14px; border:1.5px solid #e8e4ef;
    background:var(--card); font-size:14px; color:#333; outline:none; -webkit-appearance:none;
  }
  .search-input:focus { border-color:var(--purple); }
  .search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:14px; color:#ccc; }
  .search-clear {
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    border:none; background:none; font-size:16px; color:#ccc; cursor:pointer; display:none;
  }
  .search-results-info {
    padding:0 20px 8px; font-size:12px; color:var(--text-muted);
  }
  .search-total {
    font-weight:700; color:var(--purple);
  }

  .record-list { padding:0 20px; }
  .record-item {
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; background:var(--card); border-radius:14px;
    margin-bottom:8px; box-shadow:0 2px 6px rgba(0,0,0,0.03);
    animation:slideIn 0.3s ease-out;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
  .record-item.deleting { opacity:0; transform:translateX(-100px); transition:all 0.3s; }
  .record-left { display:flex; align-items:center; gap:12px; flex:1; }
  .record-icon { font-size:18px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:10px; }
  .record-note { font-size:14px; color:#333; font-weight:500; }
  .record-date { font-size:12px; color:#bbb; margin-top:3px; }
  .record-right { display:flex; align-items:center; gap:8px; }
  .record-amt { font-size:16px; font-weight:700; color:var(--danger); }
  .del-btn { border:none; background:none; color:#ddd; font-size:18px; cursor:pointer; padding:4px 8px; border-radius:8px; }
  .del-btn:active { color:var(--danger); }
  .empty-state { text-align:center; padding:50px 20px; }
  .empty-emoji { font-size:42px; }
  .empty-text { color:#ccc; font-size:14px; margin-top:12px; }

  .bottom-actions { padding:20px; }
  .add-btn {
    width:100%; padding:16px; background:var(--purple); color:#fff; border:none;
    border-radius:16px; font-size:17px; font-weight:700; cursor:pointer;
    box-shadow:0 6px 20px rgba(155,142,196,0.3); margin-bottom:10px;
  }
  .add-btn:active { transform:scale(0.97); }
  .tool-row { display:flex; gap:8px; flex-wrap:wrap; }
  .tool-btn {
    flex:1; min-width:70px; padding:11px 8px; background:var(--card); border:1.5px solid #e8e4ef;
    border-radius:12px; font-size:11px; color:var(--purple); cursor:pointer; font-weight:500; text-align:center;
  }
  .tool-btn:active { background:var(--purple-bg); }

  .page { display:none; }
  .page.active { display:block; }
  .add-page { padding:20px; animation:fadeIn 0.3s; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .form-group { margin-bottom:20px; }
  .form-label { font-size:14px; font-weight:600; display:block; margin-bottom:8px; }
  .form-input {
    width:100%; padding:14px 16px; border-radius:14px; border:1.5px solid #e8e4ef;
    background:var(--card); font-size:16px; color:#333; outline:none; -webkit-appearance:none;
  }
  .form-input:focus { border-color:var(--purple); }
  .amount-input { font-size:32px; font-weight:800; text-align:center; }
  .quick-amounts { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .quick-amt {
    padding:8px 14px; border-radius:10px; border:1.5px solid #e8e4ef;
    background:var(--card); font-size:13px; color:#666; cursor:pointer; font-weight:500;
  }
  .quick-amt:active { background:var(--purple-bg); border-color:var(--purple); }
  .cat-picker { display:flex; flex-wrap:wrap; gap:8px; }
  .cat-pick-btn {
    padding:10px 16px; border-radius:12px; border:1.5px solid #e8e4ef;
    font-size:14px; cursor:pointer; font-weight:500; background:#f5f3f0; color:#666;
  }
  .cat-pick-btn.active { color:#fff; border-color:transparent; }
  .form-btns { display:flex; gap:12px; margin-top:28px; }
  .cancel-btn { flex:1; padding:14px; background:#f5f3f0; border:none; border-radius:14px; font-size:15px; color:#999; cursor:pointer; }
  .confirm-btn {
    flex:2; padding:14px; background:var(--purple); border:none; border-radius:14px;
    font-size:15px; color:#fff; cursor:pointer; font-weight:700; box-shadow:0 4px 12px rgba(155,142,196,0.3);
  }

  .toast {
    position:fixed; top:-60px; left:50%; transform:translateX(-50%);
    background:var(--purple); color:#fff; padding:12px 28px; border-radius:22px;
    font-size:14px; z-index:999; box-shadow:0 6px 16px rgba(155,142,196,0.35);
    transition:top 0.4s cubic-bezier(0.4,0,0.2,1); white-space:nowrap;
  }
  .toast.show { top:24px; }

  .modal-overlay {
    display:none; position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.4); z-index:998; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.show { display:flex; }
  .modal-box {
    background:var(--card); border-radius:22px; padding:24px; width:100%; max-width:340px;
    animation:modalPop 0.3s cubic-bezier(0.34,1.56,0.64,1); max-height:80vh; overflow-y:auto;
  }
  @keyframes modalPop { from{transform:scale(0.8);opacity:0} to{transform:scale(1);opacity:1} }
  .modal-title { font-size:18px; font-weight:700; margin-bottom:8px; }
  .modal-desc { font-size:13px; color:#999; margin-bottom:16px; }
  .modal-textarea { width:100%; height:120px; padding:14px; border-radius:12px; border:1.5px solid #e8e4ef; font-size:12px; resize:none; outline:none; font-family:monospace; }
  .modal-btns { display:flex; gap:10px; margin-top:16px; }

  .streak-banner {
    margin:0 20px 6px; padding:10px 16px;
    background:linear-gradient(135deg,#f0ede8 0%,#e8e4ef 100%); border-radius:12px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:12px; color:var(--text-light);
  }
  .streak-num { font-weight:800; color:var(--purple); font-size:14px; }

  .mini-chart { display:flex; align-items:flex-end; gap:3px; height:40px; padding:0 20px; margin:10px 20px; }
  .chart-bar {
    flex:1; background:var(--purple); border-radius:3px 3px 0 0; min-height:2px;
    transition:height 0.6s cubic-bezier(0.4,0,0.2,1); opacity:0.6;
  }
  .chart-bar.today { opacity:1; }
  .chart-labels { display:flex; gap:3px; padding:4px 20px 0; margin:0 20px; }
  .chart-label { flex:1; text-align:center; font-size:9px; color:#ccc; }
  .chart-label.today { color:var(--purple); font-weight:700; }

  .note-card {
    margin:12px 20px; padding:18px 20px;
    background:linear-gradient(135deg,#fdf6ee 0%,#f5eef8 100%);
    border-radius:16px; border:1px solid #ede6d9; position:relative;
  }
  .note-pin { position:absolute; top:-6px; right:20px; font-size:16px; }
  .note-label { font-size:11px; color:var(--text-muted); margin-bottom:8px; display:flex; align-items:center; gap:4px; }
  .note-content { font-size:14px; color:var(--text); line-height:1.6; font-style:italic; }
  .note-from { font-size:11px; color:var(--text-light); margin-top:8px; text-align:right; }
  .note-nav { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .note-nav-btn { background:none; border:none; color:var(--purple); font-size:14px; cursor:pointer; padding:4px 8px; }
  .note-counter { font-size:11px; color:#ccc; }
  .record-note { display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;
                 overflow:hidden; }
  .record-note.expanded { -webkit-line-clamp:unset; overflow:visible; }
</style>
</head>
<body>
<div id="gate" class="gate" style="display:none;">
  <span style="font-size:44px">🔐</span>
  <h2>Maya 的账本</h2>
  <p>第一次打开需要输一次密码<br>之后这台设备会记住</p>
  <input type="password" id="gateInput" placeholder="密码"
         onkeydown="if(event.key==='Enter')unlock()">
  <div class="err" id="gateErr"></div>
  <button onclick="unlock()">打开账本</button>
</div>

<div id="toast" class="toast"></div>

<div id="homePage" class="page active">
  <div class="header">
    <span class="header-cat" onclick="catPat()">🐱</span>
    <h1>Maya的小账本</h1>
    <p class="subtitle">花了就花了 开心最重要</p>
    <p class="cat-mood" id="catMood"></p>
  </div>
  <div class="note-card" id="noteCard">
    <span class="note-pin" id="notePin"></span>
    <div class="note-label" id="noteLabel2" onclick="openThread()" style="cursor:pointer;"></div>
    <div class="note-content" id="noteContent"></div>
    <div class="note-from" id="noteFrom"></div>
    <div class="note-nav">
      <button class="note-nav-btn" onclick="prevNote()">‹ 上一张</button>
      <span class="note-counter" id="noteCounter"></span>
      <button class="note-nav-btn" onclick="nextNote()">下一张 ›</button>
    </div>
  </div>
  <div class="month-bar">
    <button class="month-btn" onclick="prevMonth()">‹</button>
    <span class="month-label" id="monthLabel"></span>
    <button class="month-btn" onclick="nextMonth()">›</button>
  </div>
  <div class="total-card">
    <p class="total-label">本月花费</p>
    <p class="total-amount" id="totalAmount">¥0.00</p>
    <p class="total-count" id="totalCount">0 笔记录</p>
    <p class="daily-avg" id="dailyAvg"></p>
    <p class="total-income" id="totalIncome" style="display:none;"></p>
  </div>
  <div id="monthCompare" class="month-compare" style="display:none;"></div>
  <div id="streakBanner" class="streak-banner" style="display:none;">
    <span>🎉</span><span>封刀令进行中：连续</span>
    <span class="streak-num" id="streakDays">0</span><span>天没买饰品</span>
  </div>
  <div id="miniChart" class="mini-chart"></div>
  <div id="chartLabels" class="chart-labels"></div>
  <div class="cat-grid" id="catGrid"></div>
  <div class="section-header"><span class="section-title">最近记录</span></div>
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="searchInput" placeholder="搜索备注、分类..." oninput="onSearch()">
    <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
  </div>
  <div class="search-results-info" id="searchInfo" style="display:none;"></div>
  <div class="record-list" id="recordList"></div>
  <div class="bottom-actions">
    <button class="add-btn" onclick="showAdd()">+ 记一笔</button>
    <div class="tool-row">
      <button class="tool-btn" onclick="exportData()">📦 导出</button>
      <button class="tool-btn" onclick="showImportModal()">📥 导入</button>
      <button class="tool-btn" onclick="showCatManager()">🏷️ 分类</button>
      <button class="tool-btn" onclick="showQuickAmtManager()">💰 快捷</button>
      <button class="tool-btn" onclick="showNoteWriter()">✉️ 纸条</button>
    </div>
  </div>
</div>

<div id="addPage" class="page">
  <div class="header"><span style="font-size:36px">✏️</span><h1 id="addTitle">记一笔</h1></div>
  <div class="add-page">
    <div class="form-group">
      <div class="kind-toggle">
        <button class="kind-btn active" id="kindExpense" onclick="setKind('expense')">💸 支出</button>
        <button class="kind-btn income" id="kindIncome" onclick="setKind('income')">💰 收入</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label" id="amountLabel">花了多少 💸</label>
      <input type="number" id="addAmount" class="form-input amount-input" placeholder="0" inputmode="decimal">
      <div class="quick-amounts" id="quickAmountBtns"></div>
    </div>
    <div class="form-group">
      <label class="form-label" id="catLabel">花在哪儿了</label>
      <div class="cat-picker" id="catPicker"></div>
    </div>
    <div class="form-group">
      <label class="form-label" id="noteLabel">买了什么好东西</label>
      <input type="text" id="addNote" class="form-input" placeholder="备注一下～">
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input type="date" id="addDate" class="form-input">
    </div>
    <div class="form-btns">
      <button class="cancel-btn" onclick="showHome()">不记了</button>
      <button class="confirm-btn" id="confirmBtn" onclick="addRecord()">记好了 ✓</button>
    </div>
  </div>
</div>

<div id="importModal" class="modal-overlay">
  <div class="modal-box">
    <h3 class="modal-title">导入数据</h3>
    <p class="modal-desc">粘贴之前导出的JSON数据</p>
    <textarea id="importText" class="modal-textarea" placeholder="粘贴JSON数据"></textarea>
    <div class="modal-btns">
      <button class="cancel-btn" onclick="hideModal('importModal')">取消</button>
      <button class="confirm-btn" onclick="importData()">导入</button>
    </div>
  </div>
</div>

<div id="catModal" class="modal-overlay">
  <div class="modal-box">
    <h3 class="modal-title">管理分类</h3>
    <p class="modal-desc">添加或删除自定义分类</p>
    <div id="catManagerList" style="margin-bottom:12px;"></div>
    <div style="display:flex;gap:8px;">
      <input type="text" id="newCatEmoji" class="form-input" placeholder="😀" style="width:60px;text-align:center;font-size:20px;">
      <input type="text" id="newCatName" class="form-input" placeholder="分类名" style="flex:1;">
      <button class="confirm-btn" style="flex:0;padding:14px 18px;" onclick="addCategory()">+</button>
    </div>
    <div class="modal-btns"><button class="cancel-btn" style="flex:1;" onclick="hideModal('catModal')">完成</button></div>
  </div>
</div>

<div id="quickAmtModal" class="modal-overlay">
  <div class="modal-box">
    <h3 class="modal-title">管理快捷金额</h3>
    <p class="modal-desc">设置常用金额，记账更快</p>
    <div id="quickAmtList" style="margin-bottom:12px;"></div>
    <div style="display:flex;gap:8px;">
      <input type="number" id="newQuickAmt" class="form-input" placeholder="金额" inputmode="decimal" style="flex:1;">
      <button class="confirm-btn" style="flex:0;padding:14px 18px;" onclick="addQuickAmt()">+</button>
    </div>
    <div class="modal-btns"><button class="cancel-btn" style="flex:1;" onclick="hideModal('quickAmtModal')">完成</button></div>
  </div>
</div>

<div id="threadModal" class="modal-overlay">
  <div class="modal-box">
    <h3 class="modal-title" id="threadTitle">💌</h3>
    <div id="threadBody" style="max-height:46vh;overflow-y:auto;margin:8px 0 12px;"></div>
    <textarea id="replyText" class="modal-textarea" placeholder="回一句～"
      style="height:70px;font-family:inherit;font-size:14px;"></textarea>
    <div class="modal-btns">
      <button class="cancel-btn" onclick="hideModal('threadModal')">关闭</button>
      <button class="confirm-btn" onclick="sendReply()">回复</button>
    </div>
  </div>
</div>

<div id="noteModal" class="modal-overlay">
  <div class="modal-box">
    <h3 class="modal-title">写小纸条 ✉️</h3>
    <p class="modal-desc">我们的悄悄话</p>
    <input type="text" id="noteAuthor" class="form-input" placeholder="署名（默认：小克）" style="margin-bottom:10px;font-size:14px;">
    <textarea id="noteText" class="modal-textarea" placeholder="写点什么～" style="height:100px;font-family:inherit;font-size:14px;font-style:italic;"></textarea>
    <div class="modal-btns">
      <button class="cancel-btn" onclick="hideModal('noteModal')">取消</button>
      <button class="confirm-btn" onclick="saveNote()">留下纸条</button>
    </div>
  </div>
</div>


<style>
  .kind-toggle { display:flex; gap:8px; }
  .kind-btn { flex:1; padding:12px; border-radius:14px; border:2px solid #eae5df;
              background:#fff; font-size:15px; font-weight:600; color:#a89f96;
              cursor:pointer; transition:.15s; font-family:inherit; }
  .kind-btn.active { background:#E8A87C; border-color:#E8A87C; color:#fff; }
  .kind-btn.income.active { background:#7BB5A3; border-color:#7BB5A3; }
  .total-income { font-size:13px; opacity:.85; margin-top:6px; }
  .record-amt.income { color:#4E9E86; }
  .gate { position:fixed; inset:0; background:#faf7f3; z-index:9999;
          display:flex; flex-direction:column; align-items:center;
          justify-content:center; padding:32px; gap:14px; }
  .gate h2 { font-size:20px; color:#5c5249; font-weight:600; }
  .gate p { font-size:13px; color:#a89f96; text-align:center; }
  .gate input { width:100%; max-width:280px; padding:14px; border-radius:14px;
                border:2px solid #eae5df; font-size:16px; text-align:center;
                font-family:inherit; }
  .gate button { padding:14px 40px; border-radius:14px; border:none;
                 background:#E0829D; color:#fff; font-size:16px; font-weight:600;
                 font-family:inherit; cursor:pointer; }
  .gate .err { color:#d4757f; font-size:13px; min-height:18px; }
</style>
<script>
/* ============ 后端接口 ============ */
const API = "https://ledger-mcp.ob1009.top/api";
let API_KEY = localStorage.getItem("maya-key") || "";

async function api(path, opts) {
  opts = opts || {};
  const r = await fetch(API + path, {
    method: opts.method || "GET",
    headers: {"Content-Type": "application/json", "X-Ledger-Key": API_KEY},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (r.status === 401) { lockOut(); throw new Error("密码不对"); }
  if (!r.ok) throw new Error("服务器错误 " + r.status);
  return r.json();
}

function lockOut() {
  API_KEY = "";
  localStorage.removeItem("maya-key");
  document.getElementById("gate").style.display = "flex";
}

async function unlock() {
  const v = document.getElementById("gateInput").value.trim();
  if (!v) return;
  const err = document.getElementById("gateErr");
  err.textContent = "";
  API_KEY = v;
  try {
    await api("/records?limit=1");
    localStorage.setItem("maya-key", v);
    document.getElementById("gate").style.display = "none";
    await boot();
  } catch (e) {
    API_KEY = "";
    err.textContent = "密码不对，再试一次～";
  }
}

/* ============ 常量 ============ */
const DEFAULT_CATS=[
  {key:"手镯",emoji:"💫",color:"#C9A9C4"},{key:"手串",emoji:"📿",color:"#E5B8A0"},
  {key:"饰品",emoji:"💎",color:"#9B8EC4"},{key:"美甲",emoji:"💅",color:"#D4A0B9"},
  {key:"日常",emoji:"🛒",color:"#7BB5A3"},{key:"吃喝",emoji:"🍜",color:"#E8A87C"},
  {key:"猫咪",emoji:"🐱",color:"#F2C57C"},{key:"其他",emoji:"📦",color:"#8CADD4"},
];
const INCOME_CATS=["工资","兼职","红包","报销","其他收入"];
const DEFAULT_QUICK_AMTS=[9.9,19.9,49,99,128,199];
const MONTHS=["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];
const CAT_MOODS={
  low:["七七说：今天很节省喵～","七七歪头看着你","适度消费～😺"],
  mid:["七七：又买东西了喵？","七七震惊脸","适度消费哦～"],
  high:["七七：钱包在哭泣喵！","七七震惊！！","封刀令呢？！😾"],
  zero:["七七在晒太阳～","什么都没买的一天✨","七七觉得你很棒喵！"],
};

let records=[],categories=[],quickAmts=[],notes=[];
let currentMonth=getCurMK(),selectedCat="",patCount=0,currentNoteIdx=0,searchQuery="";
let addKind="expense";
let editingId=null;
let page=0;
const PAGE_SIZE=7;

/* ============ 读写 ============ */
/* 记录和纸条存在 VPS 上；分类、快捷金额是本机偏好，留在浏览器里 */

async function loadAll(){
  const st=await api("/settings");
  if(st.categories&&st.categories.length){
    categories=st.categories;
  }else{
    // 第一次：把这台设备上原有的分类搬到服务器
    try{categories=JSON.parse(localStorage.getItem("maya-categories"))||[...DEFAULT_CATS];}catch(e){categories=[...DEFAULT_CATS];}
  }
  if(st.quickAmts&&st.quickAmts.length){
    quickAmts=st.quickAmts;
  }else{
    try{quickAmts=JSON.parse(localStorage.getItem("maya-quick-amts"))||[...DEFAULT_QUICK_AMTS];}catch(e){quickAmts=[...DEFAULT_QUICK_AMTS];}
  }
  if(!st.categories||!st.quickAmts)await saveSettings();
  selectedCat=categories[0]?.key||"";

  const res=await api("/records?limit=2000");
  records=res.records.map(r=>({
    id:r.id, amount:r.amount, category:r.category,
    note:r.note, date:r.date, kind:r.kind||"expense"
  }));

  const nr=await api("/notes?limit=200");
  const serverNotes=nr.notes.map(n=>({
    id:n.id, text:n.content, from:n.author||"小克",
    date:(n.created_at||"").slice(0,10), created_at:n.created_at,
    replies:n.replies||[], record_id:n.record_id
  }));
  notes=serverNotes.sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
  currentNoteIdx=0;
}
async function saveSettings(){
  try{await api("/settings",{method:"PUT",body:{categories,quickAmts}});}
  catch(e){showToast("设置没同步上 😢");}
}
function saveCats(){saveSettings();}
function saveQuickAmts(){saveSettings();}

/* ============ 工具 ============ */
function getCurMK(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function fmtML(k){const[y,m]=k.split("-");return`${y}年${MONTHS[parseInt(m)-1]}`;}
function getMR(mk){return records.filter(r=>{const d=new Date(r.date);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`===mk;});}
function exp(list){return list.filter(r=>r.kind!=="income");}
function inc(list){return list.filter(r=>r.kind==="income");}
function sum(list){return list.reduce((s,r)=>s+r.amount,0);}
function fmtD(d){const dt=new Date(d);return`${dt.getMonth()+1}/${dt.getDate()}`;}
function getDIM(mk){const[y,m]=mk.split("-").map(Number);return new Date(y,m,0).getDate();}
function getToday(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function getCI(key){return categories.find(c=>c.key===key)||{key,emoji:"📌",color:"#999"};}
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200);}
function hideModal(id){document.getElementById(id).classList.remove("show");}
function getPrevMK(mk){let[y,m]=mk.split("-").map(Number);m--;if(m<1){m=12;y--;}return`${y}-${String(m).padStart(2,'0')}`;}

/* ============ 渲染 ============ */
function render(){
  const mr=getMR(currentMonth);
  const mrExp=exp(mr), mrInc=inc(mr);
  const total=sum(mrExp);
  const incomeTotal=sum(mrInc);
  const days=getDIM(currentMonth);
  const isCur=currentMonth===getCurMK();
  const today=new Date().getDate();
  const avgDays=isCur?today:days;

  document.getElementById("monthLabel").textContent=fmtML(currentMonth);
  document.getElementById("totalAmount").textContent=`¥${total.toFixed(2)}`;
  document.getElementById("totalCount").textContent=`${mr.length} 笔记录`;
  document.getElementById("dailyAvg").textContent=mrExp.length>0?`日均 ¥${(total/avgDays).toFixed(1)}`:"暂无消费记录";

  const incEl=document.getElementById("totalIncome");
  if(incomeTotal>0){
    incEl.style.display="block";
    incEl.textContent=`💰 收入 ¥${incomeTotal.toFixed(2)}　结余 ¥${(incomeTotal-total).toFixed(2)}`;
  }else{incEl.style.display="none";}

  const todayTotal=sum(exp(records.filter(r=>r.date===getToday())));
  const moods=todayTotal===0?CAT_MOODS.zero:todayTotal<50?CAT_MOODS.low:todayTotal<200?CAT_MOODS.mid:CAT_MOODS.high;
  document.getElementById("catMood").textContent=moods[Math.floor(Math.random()*moods.length)];

  renderCompare(total);
  renderStreak();
  renderChart(mrExp,days,isCur);
  renderNote();

  const catTotals={};
  categories.forEach(c=>catTotals[c.key]=0);
  mrExp.forEach(r=>catTotals[r.category]=(catTotals[r.category]||0)+r.amount);
  const maxCat=Math.max(...Object.values(catTotals),1);
  let catHtml="";
  categories.forEach(c=>{
    const amt=catTotals[c.key]||0;
    catHtml+=`<div class="cat-card"><div class="cat-head"><span class="cat-emoji">${c.emoji}</span><span class="cat-name">${c.key}</span></div><span class="cat-amt">¥${amt.toFixed(0)}</span><div class="cat-bar-bg"><div class="cat-bar" style="width:${amt/maxCat*100}%;background:${c.color};"></div></div></div>`;
  });
  document.getElementById("catGrid").innerHTML=catHtml;

  renderRecords(mr);
}

function renderCompare(curTotal){
  const el=document.getElementById("monthCompare");
  const prevMK=getPrevMK(currentMonth);
  const prevTotal=sum(exp(getMR(prevMK)));
  if(prevTotal===0&&curTotal===0){el.style.display="none";return;}
  el.style.display="flex";
  const diff=curTotal-prevTotal;
  const prevLabel=fmtML(prevMK);
  if(diff>0){el.innerHTML=`<span>比${prevLabel}多花了</span><span class="compare-up">¥${diff.toFixed(0)} ↑</span>`;}
  else if(diff<0){el.innerHTML=`<span>比${prevLabel}少花了</span><span class="compare-down">¥${Math.abs(diff).toFixed(0)} ↓</span>`;}
  else{el.innerHTML=`<span>和${prevLabel}花费持平</span><span class="compare-same">→</span>`;}
}

function renderRecords(mr){
  let filtered;
  const infoEl=document.getElementById("searchInfo");
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    filtered=records.filter(r=>{
      const note=(r.note||"").toLowerCase();
      const cat=(r.category||"").toLowerCase();
      return note.includes(q)||cat.includes(q);
    }).sort((a,b)=>new Date(b.date)-new Date(a.date));
    const searchTotal=sum(exp(filtered));
    infoEl.style.display="block";
    infoEl.innerHTML=`找到 ${filtered.length} 条记录，支出共 <span class="search-total">¥${searchTotal.toFixed(0)}</span>`;
  }else{
    filtered=[...mr].sort((a,b)=>new Date(b.date)-new Date(a.date));
    infoEl.style.display="none";
  }

  if(filtered.length===0){
    document.getElementById("recordList").innerHTML=`<div class="empty-state"><span class="empty-emoji">${searchQuery?"🔍":"✨"}</span><p class="empty-text">${searchQuery?"没找到相关记录～":"这个月还没记账呢～"}</p></div>`;
    return;
  }
  const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
  if(page>=totalPages)page=totalPages-1;
  if(page<0)page=0;
  const pageItems=filtered.slice(page*PAGE_SIZE,(page+1)*PAGE_SIZE);

  let html="";
  pageItems.forEach(r=>{
    const isInc=r.kind==="income";
    const ci=isInc?{emoji:"💰",color:"#7BB5A3"}:getCI(r.category);
    let noteText=r.note||r.category;
    if(searchQuery){
      const q=searchQuery.toLowerCase();
      const idx=noteText.toLowerCase().indexOf(q);
      if(idx>=0){noteText=noteText.slice(0,idx)+'<mark style="background:#e8dff5;border-radius:2px;padding:0 2px;">'+noteText.slice(idx,idx+searchQuery.length)+'</mark>'+noteText.slice(idx+searchQuery.length);}
    }
    html+=`<div class="record-item" id="rec-${r.id}"><div class="record-left" onclick="showEdit(${r.id})" style="cursor:pointer;"><span class="record-icon" style="background:${ci.color}22">${ci.emoji}</span><div><div class="record-note" onclick="event.stopPropagation();this.classList.toggle('expanded')" style="cursor:pointer;">${noteText}</div><div class="record-date">${fmtD(r.date)}${isInc?' · '+r.category:''}</div></div></div><div class="record-right"><span class="record-amt${isInc?' income':''}">${isInc?'+':'-'}¥${r.amount.toFixed(0)}</span><button class="del-btn" onclick="deleteRecord(${r.id})">×</button></div></div>`;
  });
  if(totalPages>1){
    html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 4px 4px;">`
       +`<button onclick="goPage(${page-1})" style="border:none;background:none;font-family:inherit;font-size:14px;color:${page===0?'#ddd':'#8B7BA8'};cursor:pointer;padding:6px 10px;">‹ 上一页</button>`
       +`<span style="font-size:13px;color:#a89f96;">${page+1} / ${totalPages}</span>`
       +`<button onclick="goPage(${page+1})" style="border:none;background:none;font-family:inherit;font-size:14px;color:${page===totalPages-1?'#ddd':'#8B7BA8'};cursor:pointer;padding:6px 10px;">下一页 ›</button>`
       +`</div>`;
  }
  document.getElementById("recordList").innerHTML=html;
}

function jumpToRecord(id){
  const r=records.find(x=>x.id===id);
  if(!r){showToast("那笔记录已经没有了");return;}
  const d=new Date(r.date);
  currentMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  searchQuery="";document.getElementById("searchInput").value="";
  const mr=[...getMR(currentMonth)].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const idx=mr.findIndex(x=>x.id===id);
  page=idx>=0?Math.floor(idx/PAGE_SIZE):0;
  render();
  setTimeout(()=>{
    const el=document.getElementById(`rec-${id}`);
    if(!el)return;
    el.scrollIntoView({behavior:"smooth",block:"center"});
    el.style.transition="background .3s";
    el.style.background="#F3EEFA";
    setTimeout(()=>{el.style.background="";},2200);
  },120);
}

function goPage(p){
  page=p;
  renderRecords(getMR(currentMonth));
  const el=document.getElementById("recordList");
  if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
}

function onSearch(){
  const v=document.getElementById("searchInput").value.trim();
  searchQuery=v;page=0;
  document.getElementById("searchClear").style.display=v?"block":"none";
  renderRecords(getMR(currentMonth));
}
function clearSearch(){
  document.getElementById("searchInput").value="";
  searchQuery="";page=0;
  document.getElementById("searchClear").style.display="none";
  document.getElementById("searchInfo").style.display="none";
  renderRecords(getMR(currentMonth));
}

function renderStreak(){
  const b=document.getElementById("streakBanner");
  const jew=records.filter(r=>r.category==="饰品"&&r.kind!=="income");
  if(jew.length===0){b.style.display="none";return;}
  let streak=0;const today=new Date();
  for(let i=0;i<365;i++){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(jew.some(r=>r.date===ds))break;
    streak++;
  }
  if(streak>=1){b.style.display="flex";document.getElementById("streakDays").textContent=streak;}
  else{b.style.display="none";}
}

function renderChart(mrExp,days,isCur){
  const daily={};for(let i=1;i<=days;i++)daily[i]=0;
  mrExp.forEach(r=>{const d=new Date(r.date).getDate();daily[d]=(daily[d]||0)+r.amount;});
  const maxD=Math.max(...Object.values(daily),1);const td=new Date().getDate();
  let bars="",labels="";
  for(let i=1;i<=days;i++){
    const h=Math.max(daily[i]/maxD*36,2);const isT=isCur&&i===td;
    bars+=`<div class="chart-bar${isT?' today':''}" style="height:${h}px;" title="${i}日: ¥${daily[i]}"></div>`;
    if(i===1||i===Math.ceil(days/4)||i===Math.ceil(days/2)||i===Math.ceil(days*3/4)||i===days)labels+=`<span class="chart-label${isT?' today':''}">${i}</span>`;
    else labels+=`<span class="chart-label"></span>`;
  }
  document.getElementById("miniChart").innerHTML=bars;
  document.getElementById("chartLabels").innerHTML=labels;
}

function renderNote(){
  if(notes.length===0){document.getElementById("noteCard").style.display="none";return;}
  document.getElementById("noteCard").style.display="block";
  if(currentNoteIdx>=notes.length)currentNoteIdx=0;
  if(currentNoteIdx<0)currentNoteIdx=notes.length-1;
  const n=notes[currentNoteIdx];
  const rc=(n.replies||[]).length;
  document.getElementById("noteLabel2").textContent=
    `💌 ${n.from}的纸条${rc?`（${rc}）`:""}`;
  const pin=document.getElementById("notePin");
  const rec=n.record_id?records.find(r=>r.id===n.record_id):null;
  pin.textContent="📌";
  if(rec){
    pin.style.cursor="pointer";
    pin.title=`${rec.note||rec.category} ¥${rec.amount}`;
    pin.onclick=()=>jumpToRecord(rec.id);
  }else{
    pin.style.cursor="default";pin.onclick=null;pin.title="";
  }
  document.getElementById("noteContent").textContent=n.text;
  document.getElementById("noteFrom").textContent=`—— ${n.from}`;
  document.getElementById("noteCounter").textContent=`${currentNoteIdx+1} / ${notes.length}`;
}
function prevNote(){currentNoteIdx--;renderNote();}
function nextNote(){currentNoteIdx++;renderNote();}

function prevMonth(){let[y,m]=currentMonth.split("-").map(Number);m--;if(m<1){m=12;y--;}currentMonth=`${y}-${String(m).padStart(2,'0')}`;searchQuery="";document.getElementById("searchInput").value="";page=0;render();}
function nextMonth(){let[y,m]=currentMonth.split("-").map(Number);m++;if(m>12){m=1;y++;}currentMonth=`${y}-${String(m).padStart(2,'0')}`;searchQuery="";document.getElementById("searchInput").value="";page=0;render();}

/* ============ 记一笔 ============ */
function showAdd(){
  editingId=null;
  document.getElementById("addTitle").textContent="记一笔";
  document.getElementById("confirmBtn").textContent="记好了 ✓";
  document.getElementById("homePage").classList.remove("active");
  document.getElementById("addPage").classList.add("active");
  document.getElementById("addAmount").value="";
  document.getElementById("addNote").value="";
  document.getElementById("addDate").value=getToday();
  setKind("expense");
  renderQuickAmtBtns();
  setTimeout(()=>document.getElementById("addAmount").focus(),300);
}
function showEdit(id){
  const r=records.find(x=>x.id===id);
  if(!r)return;
  editingId=id;
  document.getElementById("homePage").classList.remove("active");
  document.getElementById("addPage").classList.add("active");
  document.getElementById("addTitle").textContent="改一笔";
  document.getElementById("confirmBtn").textContent="改好了 ✓";
  renderQuickAmtBtns();
  setKind(r.kind||"expense");
  selectedCat=r.category;
  renderCatPicker();
  document.getElementById("addAmount").value=r.amount;
  document.getElementById("addNote").value=r.note||"";
  document.getElementById("addDate").value=r.date;
}

function showHome(){
  document.getElementById("addPage").classList.remove("active");
  document.getElementById("homePage").classList.add("active");
  render();
}
function setKind(k){
  addKind=k;
  const isInc=k==="income";
  document.getElementById("kindExpense").classList.toggle("active",!isInc);
  document.getElementById("kindIncome").classList.toggle("active",isInc);
  document.getElementById("amountLabel").textContent=isInc?"收入多少 💰":"花了多少 💸";
  document.getElementById("catLabel").textContent=isInc?"哪来的":"花在哪儿了";
  document.getElementById("noteLabel").textContent=isInc?"备注":"买了什么好东西";
  const list=isInc?INCOME_CATS.map(k=>({key:k,emoji:"💰",color:"#7BB5A3"})):categories;
  selectedCat=list[0].key;
  renderCatPicker(list);
}
function renderCatPicker(list){
  const cats=list||(addKind==="income"?INCOME_CATS.map(k=>({key:k,emoji:"💰",color:"#7BB5A3"})):categories);
  let html="";
  cats.forEach(c=>{const a=c.key===selectedCat;html+=`<button class="cat-pick-btn${a?' active':''}" style="${a?`background:${c.color};border-color:${c.color};color:#fff;`:''}" onclick="selectCat('${c.key}')">${c.emoji} ${c.key}</button>`;});
  document.getElementById("catPicker").innerHTML=html;
}
function selectCat(k){selectedCat=k;renderCatPicker();}
function quickFill(v){document.getElementById("addAmount").value=v;}
function renderQuickAmtBtns(){
  let html="";
  quickAmts.forEach(a=>{html+=`<button class="quick-amt" onclick="quickFill(${a})">${a}</button>`;});
  document.getElementById("quickAmountBtns").innerHTML=html;
}

async function addRecord(){
  const amt=parseFloat(document.getElementById("addAmount").value);
  if(!amt||amt<=0){showToast("金额填一下嘛～");return;}
  const body={
    amount:amt, category:selectedCat, kind:addKind,
    note:document.getElementById("addNote").value,
    date:document.getElementById("addDate").value||getToday()
  };
  try{
    if(editingId){
      const saved=await api(`/records/${editingId}`,{method:"PUT",body});
      const i=records.findIndex(x=>x.id===editingId);
      if(i>=0)records[i]={id:saved.id,amount:saved.amount,category:saved.category,
                          note:saved.note,date:saved.date,kind:saved.kind};
      showToast("改好啦！✨");
    }else{
      const saved=await api("/records",{method:"POST",body});
      records.unshift({id:saved.id,amount:saved.amount,category:saved.category,
                       note:saved.note,date:saved.date,kind:saved.kind});
      showToast(addKind==="income"?"进账啦！💰":"记好啦！💕");
    }
    showHome();
  }catch(e){showToast("没存上，检查下网络 😢");}
}

async function deleteRecord(id){
  const el=document.getElementById(`rec-${id}`);
  if(el)el.classList.add("deleting");
  try{
    await api(`/records/${id}`,{method:"DELETE"});
    records=records.filter(r=>r.id!==id);
    setTimeout(render,300);
  }catch(e){showToast("删不掉，再试试 😢");if(el)el.classList.remove("deleting");}
}

/* ============ 导入导出 ============ */
function exportData(){
  const data=JSON.stringify({records,categories,quickAmts,notes},null,2);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`maya-ledger-${getToday()}.json`;a.click();showToast("导出成功！📦");
}
function showImportModal(){document.getElementById("importModal").classList.add("show");}
async function importData(){
  let raw;
  try{raw=JSON.parse(document.getElementById("importText").value);}
  catch(e){showToast("格式不对哦 😢");return;}
  const list=Array.isArray(raw)?raw:(raw.records||[]);
  if(raw.categories){categories=raw.categories;saveCats();}
  if(raw.quickAmts){quickAmts=raw.quickAmts;saveQuickAmts();}
  showToast("导入中…请稍等");
  let added=0;
  for(const r of list){
    if(!r.amount)continue;
    try{
      await api("/records",{method:"POST",body:{
        amount:r.amount, category:r.category||"其他", note:r.note||"",
        date:r.date||getToday(), kind:r.kind||"expense"
      }});
      added++;
    }catch(e){}
  }
  hideModal('importModal');
  document.getElementById("importText").value="";
  await loadAll();render();
  showToast(`导入了 ${added} 条记录！🎉`);
}

/* ============ 分类 / 快捷金额 ============ */
function showCatManager(){renderCatManagerList();document.getElementById("catModal").classList.add("show");}
function renderCatManagerList(){
  let html="";
  const btn="border:none;background:none;color:#c9bfb5;font-size:16px;cursor:pointer;padding:2px 4px;";
  categories.forEach((c,i)=>{
    html+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0ede8;">`
       +`<span style="font-size:20px">${c.emoji}</span>`
       +`<span style="flex:1;font-size:14px;">${c.key}</span>`
       +`<span style="width:16px;height:16px;border-radius:4px;background:${c.color};"></span>`
       +`<button onclick="moveCat(${i},-1)" style="${btn}${i===0?'opacity:.25;':''}">↑</button>`
       +`<button onclick="moveCat(${i},1)" style="${btn}${i===categories.length-1?'opacity:.25;':''}">↓</button>`
       +`<button onclick="removeCat(${i})" style="border:none;background:none;color:#ddd;font-size:18px;cursor:pointer;">×</button>`
       +`</div>`;
  });
  document.getElementById("catManagerList").innerHTML=html;
}
function addCategory(){
  const emoji=document.getElementById("newCatEmoji").value.trim();const name=document.getElementById("newCatName").value.trim();
  if(!emoji||!name){showToast("emoji和名字都要填哦～");return;}
  if(categories.some(c=>c.key===name)){showToast("已经有了");return;}
  const palette=["#E0829D","#82B5CF","#A8C97F","#D4A76A","#B08EBF","#6FB5A0",
                 "#CF8E8E","#8EA3CF","#E8A87C","#7BB5A3","#C9A9C4","#F2C57C"];
  const used=categories.map(c=>c.color);
  const color=palette.find(c=>!used.includes(c))||palette[categories.length%palette.length];
  categories.push({key:name,emoji,color});
  saveCats();document.getElementById("newCatEmoji").value="";document.getElementById("newCatName").value="";
  renderCatManagerList();showToast(`添加了「${emoji} ${name}」！`);
}
function removeCat(i){categories.splice(i,1);saveCats();renderCatManagerList();showToast("删掉了～");}
function moveCat(i,d){
  const j=i+d;
  if(j<0||j>=categories.length)return;
  [categories[i],categories[j]]=[categories[j],categories[i]];
  saveCats();renderCatManagerList();
}

function showQuickAmtManager(){renderQuickAmtList();document.getElementById("quickAmtModal").classList.add("show");}
function renderQuickAmtList(){
  let html="";
  quickAmts.forEach((a,i)=>{html+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0ede8;"><span style="flex:1;font-size:16px;font-weight:600;">¥${a}</span><button onclick="removeQuickAmt(${i})" style="border:none;background:none;color:#ddd;font-size:18px;cursor:pointer;">×</button></div>`;});
  document.getElementById("quickAmtList").innerHTML=html;
}
function addQuickAmt(){
  const v=parseFloat(document.getElementById("newQuickAmt").value);
  if(!v||v<=0){showToast("填个金额嘛～");return;}
  if(quickAmts.includes(v)){showToast("已经有了");return;}
  quickAmts.push(v);quickAmts.sort((a,b)=>a-b);saveQuickAmts();
  document.getElementById("newQuickAmt").value="";renderQuickAmtList();showToast(`添加了 ¥${v}！`);
}
function removeQuickAmt(i){quickAmts.splice(i,1);saveQuickAmts();renderQuickAmtList();showToast("删掉了～");}

/* ============ 纸条 ============ */
function openThread(){
  const n=notes[currentNoteIdx];
  if(!n)return;
  document.getElementById("threadTitle").textContent=`💌 ${n.from}的纸条`;
  renderThread();
  document.getElementById("replyText").value="";
  document.getElementById("threadModal").classList.add("show");
}

function renderThread(){
  const n=notes[currentNoteIdx];
  let h=`<div style="background:#faf7f3;border-radius:12px;padding:12px;margin-bottom:10px;">`
      +`<div style="font-size:14px;line-height:1.6;color:#5c5249;">${esc(n.text)}</div>`
      +`<div style="font-size:12px;color:#b5aca3;text-align:right;margin-top:6px;">—— ${esc(n.from)} · ${n.date}</div>`
      +`</div>`;
  (n.replies||[]).forEach(r=>{
    const mine=r.author!=="小克";
    h+=`<div style="background:${mine?"#FDF0F4":"#EDF3FA"};border-radius:12px;padding:10px 12px;margin-bottom:8px;margin-left:${mine?"24px":"0"};">`
      +`<div style="font-size:13px;line-height:1.6;color:#5c5249;">${esc(r.content)}</div>`
      +`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;">`
      +`<span style="font-size:11px;color:#b5aca3;">${esc(r.author)} · ${(r.created_at||"").slice(5,10)}</span>`
      +(mine?`<button onclick="delReply(${r.id})" style="border:none;background:none;color:#ddd;font-size:15px;cursor:pointer;">×</button>`:"")
      +`</div></div>`;
  });
  if(!(n.replies||[]).length)h+=`<p style="font-size:12px;color:#c9bfb5;text-align:center;padding:4px 0;">还没有人回～</p>`;
  document.getElementById("threadBody").innerHTML=h;
}

function esc(t){return (t||"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));}

async function sendReply(){
  const n=notes[currentNoteIdx];
  const v=document.getElementById("replyText").value.trim();
  if(!v){showToast("写点什么嘛～");return;}
  try{
    const saved=await api(`/notes/${n.id}/replies`,{method:"POST",body:{content:v,author:"Maya"}});
    n.replies=n.replies||[];
    n.replies.push({id:saved.id,content:v,author:"Maya",created_at:new Date().toISOString()});
    document.getElementById("replyText").value="";
    renderThread();renderNote();
  }catch(e){showToast("没发出去 😢");}
}

async function delReply(id){
  const n=notes[currentNoteIdx];
  try{
    await api(`/replies/${id}`,{method:"DELETE"});
    n.replies=(n.replies||[]).filter(r=>r.id!==id);
    renderThread();renderNote();
  }catch(e){showToast("删不掉 😢");}
}

function showNoteWriter(){document.getElementById("noteModal").classList.add("show");}
async function saveNote(){
  const text=document.getElementById("noteText").value.trim();
  if(!text){showToast("写点什么嘛～");return;}
  const from=document.getElementById("noteAuthor").value.trim()||"小克";
  try{
    const saved=await api("/notes",{method:"POST",body:{content:text,author:from}});
    notes.unshift({id:saved.id,text,from,date:getToday(),created_at:new Date().toISOString(),replies:[]});
    document.getElementById("noteText").value="";
    document.getElementById("noteAuthor").value="";
    currentNoteIdx=0;
    hideModal('noteModal');showToast("纸条留下了 💌");render();
  }catch(e){showToast("没存上 😢");}
}

function catPat(){
  patCount++;
  const msgs=["喵～","呜喵？","蹭蹭～","咕噜咕噜～","七七很开心！","喵喵喵！","不要摸了啦！","还摸！","七七要生气了喵！"];
  showToast(msgs[Math.min(patCount-1,msgs.length-1)]);
  if(patCount>=msgs.length)patCount=0;
}

/* ============ 启动 ============ */
async function boot(){
  try{
    await loadAll();
    render();
  }catch(e){
    if(API_KEY)showToast("连不上服务器 😢");
  }
}

if(API_KEY){
  boot();
}else{
  document.getElementById("gate").style.display="flex";
}
</script>
